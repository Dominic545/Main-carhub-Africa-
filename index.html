<script>

/* =========================================================
   CARHUB LISTING ENGINE
   ========================================================= */

const CARHUB_LISTINGS_KEY = "carhub_shared_listings";


/* ---------------------------------------------------------
   SAFE LISTING STORAGE
   --------------------------------------------------------- */

function getAllCarHubListings(){

  try{

    const data =
      JSON.parse(
        localStorage.getItem(
          CARHUB_LISTINGS_KEY
        )
      );

    return Array.isArray(data)
      ? data
      : [];

  }catch(error){

    return [];

  }

}


function saveAllCarHubListings(items){

  localStorage.setItem(
    CARHUB_LISTINGS_KEY,
    JSON.stringify(items)
  );

}


/* ---------------------------------------------------------
   MIGRATE EXISTING LISTINGS
   --------------------------------------------------------- */

function migrateExistingListings(){

  const existing =
    getAllCarHubListings();

  if(existing.length){

    return existing;

  }

  let oldListings=[];

  try{

    oldListings =
      JSON.parse(
        localStorage.getItem(
          "carhub_listings"
        )
      ) || [];

  }catch(error){

    oldListings=[];

  }

  if(
    Array.isArray(oldListings) &&
    oldListings.length
  ){

    const migrated =
      oldListings.map(item=>({

        ...item,

        sellerId:
          item.sellerId ||
          item.ownerId ||
          profile?.id ||
          "legacy",

        sellerName:
          item.sellerName ||
          item.seller ||
          profile?.name ||
          "CarHub Seller",

        status:
          item.status ||
          "active",

        createdAt:
          item.createdAt ||
          new Date().toISOString(),

        updatedAt:
          new Date().toISOString(),

        images:
          Array.isArray(item.images)
          ?item.images
          :item.image
            ?[item.image]
            :[]

      }));

    saveAllCarHubListings(
      migrated
    );

    return migrated;

  }

  return [];

}


let sharedListings =
  migrateExistingListings();


/* ---------------------------------------------------------
   KEEP OLD VARIABLE COMPATIBLE
   --------------------------------------------------------- */

if(
  typeof listings === "undefined"
){

  var listings =
    sharedListings;

}else{

  listings =
    sharedListings;

}


/* ---------------------------------------------------------
   LISTING HELPERS
   --------------------------------------------------------- */

function syncListings(){

  sharedListings =
    getAllCarHubListings();

  listings =
    sharedListings;

  return sharedListings;

}


function getListing(id){

  syncListings();

  return listings.find(
    item => String(item.id) === String(id)
  );

}


function getSellerListings(sellerId){

  syncListings();

  return listings.filter(
    item =>
      String(item.sellerId) ===
      String(sellerId)
  );

}


/* ---------------------------------------------------------
   IMAGE PROCESSING
   --------------------------------------------------------- */

function carHubReadFile(file){

  return new Promise(
    (resolve,reject)=>{

      const reader =
        new FileReader();

      reader.onload=()=>{
        resolve(reader.result);
      };

      reader.onerror=()=>{
        reject(
          new Error(
            "Unable to read image."
          )
        );
      };

      reader.readAsDataURL(file);

    }
  );

}


function carHubCompressImage(
  file,
  maxWidth=1400,
  quality=.82
){

  return new Promise(
    (resolve,reject)=>{

      const reader =
        new FileReader();

      reader.onload=event=>{

        const image =
          new Image();

        image.onload=()=>{

          let width =
            image.width;

          let height =
            image.height;

          if(width>maxWidth){

            height =
              Math.round(
                height *
                maxWidth /
                width
              );

            width =
              maxWidth;

          }

          const canvas =
            document.createElement(
              "canvas"
            );

          canvas.width=width;

          canvas.height=height;

          const context =
            canvas.getContext(
              "2d"
            );

          context.drawImage(
            image,
            0,
            0,
            width,
            height
          );

          resolve(
            canvas.toDataURL(
              "image/jpeg",
              quality
            )
          );

        };

        image.onerror=()=>{
          reject(
            new Error(
              "Invalid image."
            )
          );
        };

        image.src=
          event.target.result;

      };

      reader.onerror=()=>{
        reject(
          new Error(
            "Could not read image."
          )
        );
      };

      reader.readAsDataURL(file);

    }
  );

}


/* ---------------------------------------------------------
   SELLER INFORMATION
   --------------------------------------------------------- */

function getCurrentSeller(){

  const session =
    typeof getSession === "function"
    ?getSession()
    :null;

  if(!session){

    return null;

  }

  let user=null;

  if(
    typeof UserDB !== "undefined" &&
    UserDB.findById
  ){

    user =
      UserDB.findById(
        session.id
      );

  }

  return {

    id:
      user?.id ||
      session.id,

    name:
      user?.name ||
      session.name ||
      "CarHub Seller",

    email:
      user?.email ||
      session.email ||
      "",

    phone:
      user?.phone ||
      session.phone ||
      "",

    location:
      user?.location ||
      session.location ||
      "Nigeria",

    verified:
      Boolean(
        user?.verified ||
        session.verified
      )

  };

}


/* ---------------------------------------------------------
   BUILD LISTING
   --------------------------------------------------------- */

async function buildCarHubListing(formData){

  const seller =
    getCurrentSeller();

  if(!seller){

    throw new Error(
      "Please sign in before creating a listing."
    );

  }

  const files =
    Array.from(
      formData.files || []
    );

  const images=[];

  for(
    const file of files.slice(0,12)
  ){

    if(
      !file.type.startsWith(
        "image/"
      )
    ){

      continue;

    }

    const image =
      await carHubCompressImage(
        file
      );

    images.push(image);

  }


  const now =
    new Date().toISOString();


  const listing={

    id:
      "car_"+Date.now()
      .toString(36)+
      "_"+
      Math.random()
      .toString(36)
      .slice(2,8),

    sellerId:
      seller.id,

    sellerName:
      seller.name,

    sellerEmail:
      seller.email,

    sellerPhone:
      seller.phone,

    sellerLocation:
      seller.location,

    sellerVerified:
      seller.verified,

    make:
      String(
        formData.make || ""
      ).trim(),

    model:
      String(
        formData.model || ""
      ).trim(),

    year:
      String(
        formData.year || ""
      ).trim(),

    price:
      Number(
        String(
          formData.price || 0
        )
        .replace(/[^\d.]/g,"")
      ),

    mileage:
      String(
        formData.mileage || ""
      ).trim(),

    condition:
      formData.condition ||
      "Used",

    transmission:
      formData.transmission ||
      "",

    fuel:
      formData.fuel ||
      "",

    location:
      formData.location ||
      seller.location ||
      "Nigeria",

    description:
      String(
        formData.description || ""
      ).trim(),

    images,

    status:
      "active",

    views:
      0,

    saves:
      0,

    createdAt:
      now,

    updatedAt:
      now

  };

  return listing;

}


/* ---------------------------------------------------------
   CREATE LISTING
   --------------------------------------------------------- */

async function createCarHubListing(formData){

  const seller =
    getCurrentSeller();

  if(!seller){

    if(
      typeof openLogin ===
      "function"
    ){

      openLogin();

    }

    return null;

  }


  try{

    const listing =
      await buildCarHubListing(
        formData
      );

    if(
      !listing.make ||
      !listing.model ||
      !listing.year ||
      !listing.price
    ){

      toast(
        "Please complete the vehicle details."
      );

      return null;

    }


    const current =
      getAllCarHubListings();

    current.unshift(
      listing
    );

    saveAllCarHubListings(
      current
    );

    sharedListings =
      current;

    listings =
      current;


    if(
      typeof addActivity ===
      "function"
    ){

      addActivity(
        "Vehicle listed",
        `${listing.year} ${listing.make} ${listing.model} is now live on CarHub.`
      );

    }


    if(
      typeof notify ===
      "function"
    ){

      notify(
        "Vehicle published",
        "Your vehicle is now live on CarHub Africa."
      );

    }


    if(
      typeof toast ===
      "function"
    ){

      toast(
        "Vehicle listed successfully."
      );

    }


    return listing;

  }catch(error){

    console.error(
      error
    );

    toast(
      error.message ||
      "Unable to create listing."
    );

    return null;

  }

}


/* ---------------------------------------------------------
   DELETE LISTING
   --------------------------------------------------------- */

function deleteCarHubListing(id){

  const seller =
    getCurrentSeller();

  if(!seller){

    return;

  }

  const current =
    getAllCarHubListings();

  const listing =
    current.find(
      item =>
        String(item.id) ===
        String(id)
    );

  if(!listing){

    return;

  }

  if(
    String(listing.sellerId) !==
    String(seller.id)
  ){

    toast(
      "You can only manage your own listings."
    );

    return;

  }


  const confirmed =
    confirm(
      "Remove this vehicle listing?"
    );

  if(!confirmed){

    return;

  }


  const updated =
    current.filter(
      item =>
        String(item.id) !==
        String(id)
    );

  saveAllCarHubListings(
    updated
  );

  sharedListings =
    updated;

  listings =
    updated;


  if(
    typeof addActivity ===
    "function"
  ){

    addActivity(
      "Vehicle removed",
      "Your vehicle listing was removed."
    );

  }


  toast(
    "Vehicle listing removed."
  );


  if(
    typeof go ===
    "function"
  ){

    go("cars");

  }

}


/* ---------------------------------------------------------
   EDIT LISTING
   --------------------------------------------------------- */

function editCarHubListing(id){

  const seller =
    getCurrentSeller();

  const listing =
    getListing(id);

  if(!seller || !listing){

    return;

  }


  if(
    String(listing.sellerId) !==
    String(seller.id)
  ){

    toast(
      "You can only edit your own listing."
    );

    return;

  }


  openModal(
    "Edit vehicle",
    `

      <div class="form-grid">

        <div class="field">

          <label>Make</label>

          <input
            class="input"
            id="editMake"
            value="${esc(listing.make)}"
          >

        </div>

        <div class="field">

          <label>Model</label>

          <input
            class="input"
            id="editModel"
            value="${esc(listing.model)}"
          >

        </div>

        <div class="field">

          <label>Year</label>

          <input
            class="input"
            id="editYear"
            value="${esc(listing.year)}"
          >

        </div>

        <div class="field">

          <label>Price (₦)</label>

          <input
            class="input"
            id="editPrice"
            inputmode="numeric"
            value="${listing.price || ""}"
          >

        </div>

        <div class="field">

          <label>Mileage</label>

          <input
            class="input"
            id="editMileage"
            value="${esc(listing.mileage || "")}"
          >

        </div>

        <div class="field">

          <label>Condition</label>

          <select
            class="select"
            id="editCondition"
          >

            <option
              ${listing.condition==="New"
                ?"selected":""
              }
            >
              New
            </option>

            <option
              ${listing.condition==="Used"
                ?"selected":""
              }
            >
              Used
            </option>

            <option
              ${listing.condition==="Foreign Used"
                ?"selected":""
              }
            >
              Foreign Used
            </option>

          </select>

        </div>

        <div class="field full">

          <label>Description</label>

          <textarea
            class="textarea"
            id="editDescription"
          >${esc(listing.description || "")}</textarea>

        </div>

        <div class="field full">

          <button
            class="btn primary full"
            onclick="
              saveEditedCarHubListing('${listing.id}')
            "
          >
            Save changes
          </button>

        </div>

      </div>

    `
  );

}


function saveEditedCarHubListing(id){

  const seller =
    getCurrentSeller();

  if(!seller){

    return;

  }

  const current =
    getAllCarHubListings();

  const index =
    current.findIndex(
      item =>
        String(item.id) ===
        String(id)
    );

  if(index<0){

    return;

  }


  if(
    String(
      current[index].sellerId
    ) !==
    String(seller.id)
  ){

    toast(
      "You can only edit your own listing."
    );

    return;

  }


  current[index]={

    ...current[index],

    make:
      document
        .getElementById("editMake")
        .value.trim(),

    model:
      document
        .getElementById("editModel")
        .value.trim(),

    year:
      document
        .getElementById("editYear")
        .value.trim(),

    price:
      Number(
        document
          .getElementById("editPrice")
          .value
          .replace(/[^\d.]/g,"")
      ),

    mileage:
      document
        .getElementById("editMileage")
        .value.trim(),

    condition:
      document
        .getElementById("editCondition")
        .value,

    description:
      document
        .getElementById("editDescription")
        .value.trim(),

    updatedAt:
      new Date().toISOString()

  };


  saveAllCarHubListings(
    current
  );

  sharedListings =
    current;

  listings =
    current;


  closeModal();

  toast(
    "Vehicle updated."
  );


  if(
    typeof go ===
    "function"
  ){

    go(
      "vehicle",
      id
    );

  }

}


/* ---------------------------------------------------------
   IMAGE GALLERY
   --------------------------------------------------------- */

function renderCarHubGallery(listing){

  const images =
    Array.isArray(
      listing.images
    )
    ?listing.images
    :[];


  if(!images.length){

    return `

      <div
        class="vehicle-gallery-empty"
      >

        <span>🚘</span>

        <div>
          No vehicle photos yet
        </div>

      </div>

    `;

  }


  return `

    <div
      class="carhub-gallery"
      data-gallery="${listing.id}"
    >

      <div
        class="carhub-gallery-main"
      >

        <img
          id="galleryMain-${listing.id}"
          src="${esc(images[0])}"
          alt="${esc(
            listing.year+" "+
            listing.make+" "+
            listing.model
          )}"
        >

      </div>


      <div
        class="carhub-gallery-thumbs"
      >

        ${images
          .map(
            (image,index)=>`

              <button
                class="
                  carhub-gallery-thumb
                  ${index===0?"active":""}
                "
                onclick="
                  changeCarHubGallery(
                    '${listing.id}',
                    ${index}
                  )
                "
              >

                <img
                  src="${esc(image)}"
                  alt=""
                >

              </button>

            `
          )
          .join("")}

      </div>

    </div>

  `;

}


function changeCarHubGallery(
  listingId,
  imageIndex
){

  const listing =
    getListing(
      listingId
    );

  if(!listing)return;

  const images =
    listing.images || [];

  const image =
    images[imageIndex];

  if(!image)return;


  const main =
    document.getElementById(
      "galleryMain-"+listingId
    );

  if(main){

    main.style.opacity="0";

    setTimeout(()=>{

      main.src=image;

      main.style.opacity="1";

    },120);

  }


  const gallery =
    document.querySelector(
      `[data-gallery="${listingId}"]`
    );

  if(gallery){

    gallery
      .querySelectorAll(
        ".carhub-gallery-thumb"
      )
      .forEach(
        (button,index)=>{

          button.classList.toggle(
            "active",
            index===imageIndex
          );

        }
      );

  }

}

    document.getElementById(

/* ---------------------------------------------------------
   CONNECT WITH EXISTING SELL FORM
   --------------------------------------------------------- */

function setupCarHubSellForm(){

  const form =
    document.querySelector(
      "#sellForm"
    );

  if(!form){

    return;

  }


  /*
    Prevent the older local-only
    createListing handler.
  */

  form.addEventListener(
    "submit",
    async event=>{

      event.preventDefault();

      const seller =
        getCurrentSeller();

      if(!seller){

        if(
          typeof openLogin ===
          "function"
        ){

          openLogin();

        }

        return;

      }


      const getValue=id=>{

        const el =
          document.getElementById(
            id
          );

        return el
          ?el.value
          :"";

      };


      const fileInput =
        document.querySelector(
          "#sellPhotos"
        ) ||
        document.querySelector(
          "#listingPhotos"
        ) ||
        form.querySelector(
          'input[type="file"]'
        );


      const formData={

        make:
          getValue("sellMake") ||
          getValue("listingMake"),

        model:
          getValue("sellModel") ||
          getValue("listingModel"),

        year:
          getValue("sellYear") ||
          getValue("listingYear"),

        price:
          getValue("sellPrice") ||
          getValue("listingPrice"),

        mileage:
          getValue("sellMileage") ||
          getValue("listingMileage"),

        condition:
          getValue("sellCondition") ||
          getValue("listingCondition") ||
          "Used",

        transmission:
          getValue("sellTransmission") ||
          getValue("listingTransmission"),

        fuel:
          getValue("sellFuel") ||
          getValue("listingFuel"),

        location:
          getValue("sellLocation") ||
          getValue("listingLocation") ||
          seller.location,

        description:
          getValue("sellDescription") ||
          getValue("listingDescription"),

        files:
          fileInput
          ?fileInput.files
          :[]

      };


      const listing =
        await createCarHubListing(
          formData
        );


      if(listing){

        if(
          typeof closeModal ===
          "function"
        ){

          closeModal();

        }


        refreshCarHubCatalogue();

        renderMyVehicles();

        if(
          typeof go ===
          "function"
        ){

          go(
            "vehicle",
            listing.id
          );

        }

      }

    },
    true
  );

}


/* ---------------------------------------------------------
   SELLER PROFILE BEFORE BUYING
   --------------------------------------------------------- */

function requireSellerView(
  carId,
  nextAction

    getListing(carId);

  if(!listing){

        before continuing with this
        vehicle.

      </div>

}


/* ---------------------------------------------------------
   VIEW TRACKING
   --------------------------------------------------------- */

function registerCarView(id){

  const current =
    getAllCarHubListings();

  const index =
    current.findIndex(
      item =>
        String(item.id) ===
        String(id)
    );

  if(index<0)return;

  current[index].views =
    Number(
      current[index].views || 0
    ) + 1;

  saveAllCarHubListings(
    current
  );

  sharedListings =
    current;

  listings =
    current;

}


/* ---------------------------------------------------------
   SAVE VEHICLE
   --------------------------------------------------------- */

function saveCarHubVehicle(id){

  const session =
    typeof getSession ===
    "function"
    ?getSession()
    :null;

  if(!session){

    if(
      typeof openLogin ===
      "function"
    ){

      openLogin();

    }

    return;

  }


  const key =
    "carhub_saved_"+session.id;

  let saved=[];

  try{

    saved =
      JSON.parse(
        localStorage.getItem(key)
      ) || [];

  }catch(error){

    saved=[];

  }


  const exists =
    saved.includes(id);


  if(exists){

    saved =
      saved.filter(
        item => item!==id
      );

    toast(
      "Vehicle removed from saved."
    );

  }else{

    saved.push(id);

    toast(
      "Vehicle saved."
    );

  }


  localStorage.setItem(
    key,
    JSON.stringify(saved)
  );


  const current =
    getAllCarHubListings();

  const index =
    current.findIndex(
      item =>
        String(item.id) ===
        String(id)
    );

  if(index>=0){

    current[index].saves =
      Math.max(
        0,
        Number(
          current[index].saves || 0
        ) +
        (exists?-1:1)
      );

    saveAllCarHubListings(
      current
    );

    sharedListings =
      current;

    listings =
      current;

  }

}


/* ---------------------------------------------------------
   LISTING STATUS
   --------------------------------------------------------- */

function setCarHubListingStatus(
  id,
  status
){

  const seller =
    getCurrentSeller();

  if(!seller)return;


  const current =
    getAllCarHubListings();

  const index =
    current.findIndex(
      item =>
        String(item.id) ===
        String(id)
    );

  if(index<0)return;


  if(
    String(
      current[index].sellerId
    ) !==
    String(seller.id)
  ){

    toast(
      "You can only manage your own listing."
    );

    return;

  }


  current[index].status =
    status;

  current[index].updatedAt =
    new Date().toISOString();


  saveAllCarHubListings(
    current
  );

  sharedListings =
    current;

  listings =
    current;


  refreshCarHubCatalogue();

}


/* ---------------------------------------------------------
   SELLER DASHBOARD STATISTICS
   --------------------------------------------------------- */

function getSellerStats(){

  const seller =
    getCurrentSeller();

  if(!seller){

    return {

      listings:0,
      active:0,
      views:0,
      saves:0

    };

  }


  const mine =
    getSellerListings(
      seller.id
    );


  return {

    listings:
      mine.length,

    active:
      mine.filter(
        item =>
          item.status==="active"
      ).length,

    views:
      mine.reduce(
        (total,item)=>
          total+
          Number(
            item.views||0
          ),
        0
      ),

    saves:
      mine.reduce(
        (total,item)=>
          total+
          Number(
            item.saves||0
          ),
        0
      )

  };

}


/* ---------------------------------------------------------
   SELLER DASHBOARD WIDGET
   --------------------------------------------------------- */

function renderSellerStats(){

  const container =
    document.getElementById(
      "sellerStats"
    );

  if(!container){

    return;

  }


  const stats =
    getSellerStats();


  container.innerHTML=`

    <div class="stat-card">

      <span>
        My listings
      </span>

      <strong>
        ${stats.listings}
      </strong>

    </div>


    <div class="stat-card">

      <span>
        Active
      </span>

      <strong>
        ${stats.active}
      </strong>

    </div>


    <div class="stat-card">

      <span>
        Views
      </span>

      <strong>
        ${stats.views}
      </strong>

    </div>


    <div class="stat-card">

      <span>
        Saves
      </span>

      <strong>
        ${stats.saves}
      </strong>

    </div>

  `;

}


/* ---------------------------------------------------------
   LISTING SEARCH
   --------------------------------------------------------- */

function searchCarHubListings(query){

  syncListings();

  const q =
    String(query || "")
      .trim()
      .toLowerCase();


  if(!q){

    return listings;

  }


  return listings.filter(
    car =>{

      const text =
        [

          car.make,
          car.model,
          car.year,
          car.location,
          car.condition,
          car.transmission,
          car.fuel,
          car.sellerName

        ]
        .join(" ")
        .toLowerCase();


      return text.includes(q);

    }
  );

}


/* ---------------------------------------------------------
   SEARCH HOOK
   --------------------------------------------------------- */

document.addEventListener(
  "input",
  event=>{

    const input =
      event.target.closest(
        "#searchInput"
      );

    if(!input)return;


    const results =
      searchCarHubListings(
        input.value
      );


    const catalogue =
      document.getElementById(
        "catalogue"
      );

    if(!catalogue)return;


    if(!results.length){

      catalogue.innerHTML=`

        <div
          class="empty"
          style="grid-column:1/-1"
        >

          <strong>
            No matching vehicles
          </strong>

          <p>
            Try another make, model,
            location or year.
          </p>

        </div>

      `;

      return;

    }


    /*
      Use the same catalogue card
      presentation as the main catalogue.
    */

    catalogue.innerHTML =
      results.map(
        car=>`

          <article
            class="
              car-card
              floating-car-card
            "
            onclick="
              go('vehicle','${car.id}')
            "
          >

            <div
              class="car-card-image"
            >

              <img
                src="${esc(
                  car.images?.[0] ||
                  (
                    typeof demoImages !==
                    "undefined"
                    ?demoImages[0]
                    :""
                  )
                )}"
                alt=""
                loading="lazy"
              >

            </div>

            <div
              class="car-card-body"
            >

              <div
                class="car-card-title"
              >

                ${esc(car.year)}
                ${esc(car.make)}
                ${esc(car.model)}

              </div>

              <div
                class="car-card-price"
              >

                ${money(car.price)}

              </div>

              <div
                class="car-card-meta"
              >

                ${esc(
                  car.mileage ||
                  "Mileage N/A"
                )}

                ·

                ${esc(
                  car.location ||
                  "Nigeria"
                )}

              </div>

            </div>

          </article>

        `
      ).join("");

  }
);


/* ---------------------------------------------------------
   INITIALIZE
   --------------------------------------------------------- */

function initializeCarHubListings(){

  syncListings();

  refreshCarHubCatalogue();

  renderMyVehicles();

  renderSellerStats();

  /*
    Delay form binding slightly so that
    existing page initialization finishes first.
  */

  setTimeout(
    setupCarHubSellForm,
    300
  );

}


document.addEventListener(
  "DOMContentLoaded",
  initializeCarHubListings
);


/* ---------------------------------------------------------
   BACKEND-READY API LAYER
   --------------------------------------------------------- */

window.CarHubAPI={

  listings:{

    all(){

      return getAllCarHubListings();

    },

    find(id){

      return getListing(id);

    },

    mine(){

      const seller =
        getCurrentSeller();

      return seller
        ?getSellerListings(
          seller.id
        )
        :[];

    },

    search(query){

      return searchCarHubListings(
        query
      );

    },

    create(data){

      return createCarHubListing(
        data
      );

    },

    delete(id){

      return deleteCarHubListing(
        id
      );

    },

    edit(id){

      return editCarHubListing(
        id
      );

    },

    status(id,status){

      return setCarHubListingStatus(
        id,
        status
      );

    }

  },

  seller:{

    current(){

      return getCurrentSeller();

    },

    listings(){

      const seller =
        getCurrentSeller();

      return seller
        ?getSellerListings(
          seller.id
        )
        :[];

    },

    stats(){

      return getSellerStats();

    }

  }

};


console.log(

);
