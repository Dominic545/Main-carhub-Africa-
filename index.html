========================================================= -->

<style>

/* ADMIN BUTTON */

.adminNavBtn{
  display:none;
  border:1px solid rgba(168,239,209,.28);
  background:rgba(168,239,209,.09);
  color:var(--mint);
  padding:10px 14px;
  border-radius:14px;
  font-weight:800;
}

.adminNavBtn:hover{
  background:rgba(168,239,209,.16);
}


/* ADMIN OVERLAY */

#adminOverlay{
  z-index:180;
}

.adminModal{
  width:min(1120px,100%);
  max-height:94vh;
  overflow:auto;
  padding:0;
  background:
    linear-gradient(
      145deg,
      rgba(12,18,15,.98),
      rgba(7,10,9,.98)
    );
}


/* ADMIN HEADER */

.adminHeader{
  position:sticky;
  top:0;
  z-index:5;
  padding:22px;
  border-bottom:1px solid var(--line);

  backdrop-filter:blur(22px);
}

.adminHeaderTop{
  display:flex;
  align-items:center;
  gap:15px;
}

.adminHeaderInfo{

}

.adminHeaderInfo h2{

}

.adminHeaderInfo p{

  margin-top:4px;
}

.adminClose{
  width:40px;
  height:40px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.055);
  color:white;
  border-radius:13px;
}


/* ADMIN CONTENT */

.adminContent{
  padding:22px;
}


/* STATS */

.adminStats{
  display:grid;
  grid-template-columns:

  margin-bottom:22px;
}

.adminStat{
  padding:18px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.045);
  border-radius:20px;
}

.adminStatLabel{
  color:var(--muted);
  font-size:12px;
}

.adminStatValue{

  font-weight:900;
  margin-top:7px;
  letter-spacing:-1px;
}

.adminStatValue.mint{
  color:var(--mint);
}

.adminStatValue.gold{
  color:var(--gold);
}

.adminStatValue.danger{
  color:var(--danger);
}


/* ADMIN NAV */

.adminTabs{
  display:flex;
  gap:8px;
  overflow:auto;
  margin-bottom:18px;
}

.adminTab{
  white-space:nowrap;
  border:1px solid var(--line);
  background:rgba(255,255,255,.045);
  color:#aeb8b4;
  padding:10px 15px;
  border-radius:14px;
}

.adminTab.active{
  color:var(--mint);
  background:rgba(168,239,209,.1);
  border-color:rgba(168,239,209,.28);
}


/* ADMIN TOOLBAR */

.adminToolbar{
  display:flex;
  gap:9px;
  margin-bottom:15px;
}

.adminSearch{
  flex:1;
  min-width:0;
  border:1px solid var(--line);
  outline:0;
  background:rgba(255,255,255,.045);
  color:white;
  padding:12px 14px;
  border-radius:14px;
}

.adminSearch::placeholder{
  color:#737d79;
}


/* ADMIN TABLE */

.adminList{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.adminRow{
  display:grid;
  grid-template-columns:
    minmax(180px,1.5fr)
    minmax(110px,.7fr)
    minmax(110px,.7fr)
    auto;
  gap:14px;
  align-items:center;
  padding:15px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.04);
  border-radius:18px;
}

.adminRow:hover{
  background:rgba(255,255,255,.065);
}

.adminMain{
  min-width:0;
}

.adminMain strong{
  display:block;
  font-size:15px;
}

.adminMain span{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.adminStatus{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:max-content;
  padding:6px 9px;
  border-radius:99px;
  font-size:10px;
  font-weight:900;
  text-transform:uppercase;
}

.statusVerified,
.statusActive{
  color:var(--mint);
  background:rgba(168,239,209,.1);
}

.statusPending{
  color:var(--gold);
  background:rgba(216,200,167,.1);
}

.statusSuspended,
.statusHidden{
  color:var(--danger);
  background:rgba(255,125,125,.09);
}

.adminActions{
  display:flex;
  gap:6px;
  justify-content:flex-end;
  flex-wrap:wrap;
}

.adminAction{
  border:1px solid var(--line);
  background:rgba(255,255,255,.055);
  color:white;
  padding:8px 10px;
  border-radius:11px;
  font-size:11px;
  font-weight:800;
}

.adminAction:hover{
  background:rgba(255,255,255,.1);
}

.adminAction.verify{
  color:var(--mint);
  border-color:rgba(168,239,209,.22);
}

.adminAction.danger{
  color:var(--danger);
}


/* EMPTY */

.adminEmpty{
  text-align:center;
  padding:50px 20px;
  border:1px dashed var(--line);
  border-radius:20px;
  color:var(--muted);
}


/* DETAIL PANEL */

.adminDetail{
  margin-top:12px;
  padding:16px;
  border:1px solid var(--line);
  border-radius:17px;
  background:rgba(0,0,0,.16);
}

.adminDetail textarea{
  width:100%;
  min-height:80px;
  resize:vertical;
  border:1px solid var(--line);
  outline:0;
  color:white;
  background:rgba(255,255,255,.045);
  border-radius:13px;
  padding:12px;
}


/* RESPONSIVE */

@media(max-width:800px){

  .adminStats{
    grid-template-columns:1fr 1fr;
  }

  .adminRow{
    grid-template-columns:1fr;
  }

  .adminActions{
    justify-content:flex-start;
  }

}

@media(max-width:520px){

  .adminStats{
    grid-template-columns:1fr 1fr;
  }

  .adminContent{
    padding:15px;
  }

  .adminHeader{
    padding:17px;
  }

  .adminHeaderInfo h2{
    font-size:22px;
  }

}

</style>

========================================================= -->

        <div class="adminToolbar">

          <input

            class="adminSearch"

            oninput="filterAdminListings()">

          <button
            class="secondary"
            onclick="loadAdminData()">

  </div>

<script>

/* =========================================================
   CARHUB AFRICA
   STEP 5 — ADMIN DASHBOARD LOGIC
========================================================= */

let adminSellers=[];
let adminListings=[];
let adminTab="sellers";


/* =========================================================
   ADMIN ACCESS
========================================================= */

function isCarHubAdmin(){

  return !!(
    currentUser &&
    profile &&
    profile.role==="admin"
  );

}


function showAdminButton(){

  const button=
    document.getElementById("adminNavButton");

  if(!button)return;

  if(isCarHubAdmin()){

    button.style.display="block";

  }else{

    button.style.display="none";

  }

}


/* =========================================================
   OPEN ADMIN
========================================================= */

async function openAdminDashboard(){

  if(!currentUser){

    toast(
      "Sign in required",
      "Sign in with your CarHub administrator account."
    );

    openAuth();
    return;

  }


  if(!isCarHubAdmin()){

    toast(
      "Admin access required",
      "This account is not an administrator."
    );

    return;

  }


  document
    .getElementById("adminOverlay")
    .classList.add("show");


  await loadAdminData();

}


/* =========================================================
   ADMIN TABS
========================================================= */

function switchAdminTab(tab){

  adminTab=tab;


  const sellersPanel=
    document.getElementById("adminSellersPanel");

  const listingsPanel=
    document.getElementById("adminListingsPanel");


  const sellersTab=
    document.getElementById("adminTabSellers");

  const listingsTab=
    document.getElementById("adminTabListings");


  if(tab==="sellers"){

    sellersPanel.classList.remove("hidden");
    listingsPanel.classList.add("hidden");

    sellersTab.classList.add("active");
    listingsTab.classList.remove("active");

    filterAdminSellers();

  }else{

    sellersPanel.classList.add("hidden");
    listingsPanel.classList.remove("hidden");

    sellersTab.classList.remove("active");
    listingsTab.classList.add("active");

    filterAdminListings();

  }

}


/* =========================================================
   LOAD ADMIN DATA
========================================================= */

async function loadAdminData(){

  if(!isCarHubAdmin())return;


  const [
    profilesResult,
    listingsResult
  ]=await Promise.all([

    db
      .from("profiles")
      .select("*")
      .order("created_at",{ascending:false}),

    db
      .from("listings")
      .select("*")
      .order("created_at",{ascending:false})

  ]);


  if(profilesResult.error){

    toast(
      "Seller loading failed",
      profilesResult.error.message
    );

    return;

  }


  if(listingsResult.error){

    toast(
      "Listing loading failed",
      listingsResult.error.message
    );

    return;

  }


  adminSellers=
    profilesResult.data || [];

  adminListings=
    listingsResult.data || [];


  updateAdminStats();

  filterAdminSellers();

  filterAdminListings();

}


/* =========================================================
   ADMIN STATISTICS
========================================================= */

function updateAdminStats(){

  const totalSellers=
    adminSellers.length;

  const verifiedSellers=
    adminSellers.filter(
      x=>x.verification_status==="verified"
    ).length;

  const totalListings=
    adminListings.length;

  const pending=
    adminSellers.filter(
      x=>x.verification_status==="pending"
    ).length;


  document
    .getElementById("adminTotalSellers")
    .textContent=totalSellers;


  document
    .getElementById("adminVerifiedSellers")
    .textContent=verifiedSellers;


  document
    .getElementById("adminTotalListings")
    .textContent=totalListings;


  document
    .getElementById("adminPendingCount")
    .textContent=pending;

}


/* =========================================================
   SELLER SEARCH
========================================================= */

function filterAdminSellers(){

  const input=
    document
      .getElementById("adminSellerSearch")
      .value
      .trim()
      .toLowerCase();


  let data=[...adminSellers];


  if(input){

    data=data.filter(seller=>{

      return (

        String(seller.name || "")
          .toLowerCase()
          .includes(input)

        ||

        String(seller.email || "")
          .toLowerCase()
          .includes(input)

        ||

        String(seller.role || "")
          .toLowerCase()
          .includes(input)

      );

    });

  }


  renderAdminSellers(data);

}


/* =========================================================
   RENDER SELLERS
========================================================= */

function renderAdminSellers(data){

  const box=
    document.getElementById("adminSellerList");


  if(!data.length){

    box.innerHTML=`
      <div class="adminEmpty">
        No sellers found.
      </div>
    `;

    return;

  }


  box.innerHTML=data.map(seller=>{

    const status=
      seller.verification_status ||
      "pending";


    let statusClass=
      "statusPending";


    if(status==="verified"){
      statusClass="statusVerified";
    }


    if(status==="suspended"){
      statusClass="statusSuspended";
    }


    const isCurrent=
      seller.id===currentUser.id;


    return `

      <div class="adminRow">

        <div class="adminMain">

          <strong>
            ${escapeHtml(
              seller.name ||
              seller.email ||
              "CarHub User"
            )}
          </strong>

          <span>
            ${escapeHtml(
              seller.email || "No email"
            )}
          </span>

          <span>
            Role:
            ${escapeHtml(
              seller.role || "user"
            )}
          </span>

        </div>


        <div>

          <span class="adminStatus ${statusClass}">
            ${escapeHtml(status)}
          </span>

        </div>


        <div>

          <span class="adminStatus ${
            seller.role==="admin"
            ?"statusVerified"
            :"statusPending"
          }">

            ${seller.role==="admin"
              ?"ADMIN"
              :"SELLER"}

          </span>

        </div>


        <div class="adminActions">

          ${
            status!=="verified"
            ?

            `<button
              class="adminAction verify"
              onclick="verifySeller('${escapeHtml(seller.id)}')">
              ✓ Verify
            </button>`

            :

            `<button
              class="adminAction"
              onclick="setSellerPending('${escapeHtml(seller.id)}')">
              Pending
            </button>`
          }


          ${
            status!=="suspended"
            ?

            `<button
              class="adminAction danger"
              onclick="suspendSeller('${escapeHtml(seller.id)}')">
              Suspend
            </button>`

            :

            `<button
              class="adminAction verify"
              onclick="restoreSeller('${escapeHtml(seller.id)}')">
              Restore
            </button>`
          }


          ${
            !isCurrent
            ?

            `<button
              class="adminAction"
              onclick="viewSeller('${escapeHtml(seller.id)}')">
              View
            </button>`

            :

            `<button
              class="adminAction"
              onclick="viewSeller('${escapeHtml(seller.id)}')">
              You
            </button>`
          }

        </div>

      </div>

    `;

  }).join("");

}


/* =========================================================
   VERIFY SELLER
========================================================= */

async function verifySeller(id){

  if(!isCarHubAdmin())return;


  const {error}=await db
    .from("profiles")
    .update({

      verification_status:"verified",

      verification_note:
        "Verified by CarHub administrator.",

      verified_at:
        new Date().toISOString()

    })
    .eq("id",id);


  if(error){

    toast(
      "Verification failed",
      error.message
    );

    return;

  }


  toast(
    "Seller verified",
    "The seller has been marked as verified."
  );


  await loadAdminData();

  await loadListings();

}


/* =========================================================
   SET PENDING
========================================================= */

async function setSellerPending(id){

  if(!isCarHubAdmin())return;


  const {error}=await db
    .from("profiles")
    .update({

      verification_status:"pending",

      verification_note:
        "Verification pending.",

      verified_at:null

    })
    .eq("id",id);


  if(error){

    toast(
      "Update failed",
      error.message
    );

    return;

  }


  toast(
    "Seller moved to pending",
    "The seller is awaiting verification."
  );


  await loadAdminData();

}


/* =========================================================
   SUSPEND SELLER
========================================================= */

async function suspendSeller(id){

  if(!isCarHubAdmin())return;


  if(id===currentUser.id){

    toast(
      "Action blocked",
      "You cannot suspend your own administrator account."
    );

    return;

  }


  const confirmed=
    confirm(
      "Suspend this seller? Their account will be marked as suspended."
    );


  if(!confirmed)return;


  const {error}=await db
    .from("profiles")
    .update({

      verification_status:"suspended",

      verification_note:
        "Account suspended by CarHub administrator."

    })
    .eq("id",id);


  if(error){

    toast(
      "Suspension failed",
      error.message
    );

    return;

  }


  toast(
    "Seller suspended",
    "The seller has been suspended."
  );


  await loadAdminData();

}


/* =========================================================
   RESTORE SELLER
========================================================= */

async function restoreSeller(id){

  if(!isCarHubAdmin())return;


  const {error}=await db
    .from("profiles")
    .update({

      verification_status:"pending",

      verification_note:
        "Seller restored and awaiting verification."

    })
    .eq("id",id);


  if(error){

    toast(
      "Restore failed",
      error.message
    );

    return;

  }


  toast(
    "Seller restored",
    "The seller is now pending verification."
  );


  await loadAdminData();

}


/* =========================================================
   VIEW SELLER
========================================================= */

function viewSeller(id){

  const seller=
    adminSellers.find(
      x=>String(x.id)===String(id)
    );


  if(!seller)return;


  const sellerListings=
    adminListings.filter(
      x=>String(x.seller_id)===String(id)
    );


  const listingText=
    sellerListings.length
    ? sellerListings
        .map(
          x=>`${x.make || ""} ${x.model || ""}`
        )
        .join(", ")
    : "No listings";


  alert(

`CarHub Seller

Name: ${seller.name || "Not provided"}

Email: ${seller.email || "Not provided"}

Role: ${seller.role || "user"}

Verification: ${seller.verification_status || "pending"}

Listings: ${listingText}`

  );

}


/* =========================================================
   LISTING SEARCH
========================================================= */

function filterAdminListings(){

  const input=
    document
      .getElementById("adminListingSearch")
      .value
      .trim()
      .toLowerCase();


  let data=[...adminListings];


  if(input){

    data=data.filter(listing=>{

      return (

        `${listing.make || ""} ${listing.model || ""} ${listing.year || ""}`
          .toLowerCase()
          .includes(input)

        ||

        String(listing.seller_name || "")
          .toLowerCase()
          .includes(input)

        ||

        String(listing.seller_location || "")
          .toLowerCase()
          .includes(input)

      );

    });

  }


  renderAdminListings(data);

}


/* =========================================================
   RENDER LISTINGS
========================================================= */

function renderAdminListings(data){

  const box=
    document.getElementById("adminListingList");


  if(!data.length){

    box.innerHTML=`
      <div class="adminEmpty">
        No listings found.
      </div>
    `;

    return;

  }


  box.innerHTML=data.map(listing=>{

    const status=
      listing.listing_status ||
      "active";


    let statusClass=
      "statusActive";


    if(status==="hidden"){
      statusClass="statusHidden";
    }


    if(status==="pending"){
      statusClass="statusPending";
    }


    return `

      <div class="adminRow">

        <div class="adminMain">

          <strong>
            ${escapeHtml(
              listing.make || ""
            )}
            ${escapeHtml(
              listing.model || ""
            )}
            ${listing.year
              ? " · "+escapeHtml(listing.year)
              : ""}
          </strong>

          <span>
            Seller:
            ${escapeHtml(
              listing.seller_name ||
              "Unknown seller"
            )}
          </span>

          <span>
            ${money(listing.price)}
            ·
            ${escapeHtml(
              listing.seller_location ||
              "Nigeria"
            )}
          </span>

        </div>


        <div>

          <span class="adminStatus ${statusClass}">
            ${escapeHtml(status)}
          </span>

        </div>


        <div>

          ${
            listing.condition
            ?

            `<span class="adminStatus statusPending">
              ${escapeHtml(listing.condition)}
            </span>`

            :

            ""
          }

        </div>


        <div class="adminActions">

          ${
            status!=="active"

            ?

            `<button
              class="adminAction verify"
              onclick="activateListing('${escapeHtml(listing.id)}')">
              ✓ Activate
            </button>`

            :

            `<button
              class="adminAction"
              onclick="hideListing('${escapeHtml(listing.id)}')">
              Hide
            </button>`
          }


          <button
            class="adminAction"
            onclick="viewAdminListing('${escapeHtml(listing.id)}')">
            View
          </button>


          <button
            class="adminAction danger"
            onclick="deleteAdminListing('${escapeHtml(listing.id)}')">
            Delete
          </button>

        </div>

      </div>

    `;

  }).join("");

}


/* =========================================================
   ACTIVATE LISTING
========================================================= */

async function activateListing(id){

  if(!isCarHubAdmin())return;


  const {error}=await db
    .from("listings")
    .update({
      listing_status:"active"
    })
    .eq("id",id);


  if(error){

    toast(
      "Activation failed",
      error.message
    );

    return;

  }


  toast(
    "Listing activated",
    "The vehicle is now active."
  );


  await loadAdminData();

  await loadListings();

}


/* =========================================================
   HIDE LISTING
========================================================= */

async function hideListing(id){

  if(!isCarHubAdmin())return;


  const {error}=await db
    .from("listings")
    .update({
      listing_status:"hidden"
    })
    .eq("id",id);


  if(error){

    toast(
      "Could not hide listing",
      error.message
    );

    return;

  }


  toast(
    "Listing hidden",
    "The vehicle has been removed from active marketplace results."
  );


  await loadAdminData();

  await loadListings();

}


/* =========================================================
   DELETE LISTING
========================================================= */

async function deleteAdminListing(id){

  if(!isCarHubAdmin())return;


  const confirmed=
    confirm(
      "Delete this vehicle listing permanently?"
    );


  if(!confirmed)return;


  const {error}=await db
    .from("listings")
    .delete()
    .eq("id",id);


  if(error){

    toast(
      "Delete failed",
      error.message
    );

    return;

  }


  toast(
    "Listing deleted",
    "The vehicle has been removed."
  );


  await loadAdminData();

  await loadListings();

}


/* =========================================================
   VIEW ADMIN LISTING
========================================================= */

function viewAdminListing(id){

  const listing=
    adminListings.find(
      x=>String(x.id)===String(id)
    );


  if(!listing)return;


  const image=
    listing.images?.[0] || "";


  const note=
    prompt(
      "Admin note for this listing:",
      listing.admin_note || ""
    );


  if(note!==null){

    saveAdminNote(
      id,
      note
    );

  }


  if(image){

    const opened=
      window.open(
        image,
        "_blank"
      );

  }

}


/* =========================================================
   SAVE ADMIN NOTE
========================================================= */

async function saveAdminNote(id,note){

  if(!isCarHubAdmin())return;


  const {error}=await db
    .from("listings")
    .update({
      admin_note:note
    })
    .eq("id",id);


  if(error){

    toast(
      "Note failed",
      error.message
    );

    return;

  }


  toast(
    "Admin note saved",
    "The listing note has been updated."
  );


  await loadAdminData();

}


/* =========================================================
   ADMIN REFRESH WHEN PROFILE LOADS
========================================================= */

const originalUpdateAuthButton=
  window.updateAuthButton;


window.updateAuthButton=function(){

  if(typeof originalUpdateAuthButton==="function"){
    originalUpdateAuthButton();
  }

  showAdminButton();

};


/* =========================================================
   ALSO CHECK AFTER PROFILE LOAD
========================================================= */

const originalLoadProfile=
  window.loadProfile;


window.loadProfile=async function(){

  if(typeof originalLoadProfile==="function"){
    await originalLoadProfile();
  }

  showAdminButton();

};

   PROTECT ADMIN OVERLAY

document

  ?.addEventListener(
    "click",

      if(event.target.id==="adminOverlay"){

        closeOverlay("adminOverlay");

      }

    }
  );
