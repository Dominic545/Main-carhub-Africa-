<script>

/* =========================================================
   CARHUB DATA ENGINE
   Shared-backend-ready architecture
   ========================================================= */

const CH={
  version:"2.0",
  app:"CarHub Africa"
};


/* ---------------------------------------------------------
   LOCAL SESSION
   --------------------------------------------------------- */

const SESSION_KEY="carhub_session";

function getSession(){

  try{

    return JSON.parse(
      localStorage.getItem(SESSION_KEY)
    ) || null;

  }catch{

    return null;

  }

}

function setSession(user){

  localStorage.setItem(
    SESSION_KEY,
    JSON.stringify(user)
  );

}

function clearSession(){

  localStorage.removeItem(
    SESSION_KEY
  );

}


/* ---------------------------------------------------------
   USER DATABASE ADAPTER
   --------------------------------------------------------- */

const UserDB={

  key:"carhub_users",

  all(){

    try{

      return JSON.parse(
        localStorage.getItem(this.key)
      ) || [];

    }catch{

      return [];

    }

  },

  save(users){

    localStorage.setItem(
      this.key,
      JSON.stringify(users)
    );

  },

  findByEmail(email){

    return this.all().find(
      user =>
        user.email.toLowerCase() ===
        email.toLowerCase()
    );

  },

  findById(id){

    return this.all().find(
      user => user.id===id
    );

  },

  create(data){

    const users=this.all();

    const user={

      id:
        "usr_"+Date.now().toString(36)+
        Math.random().toString(36).slice(2,8),

      name:data.name.trim(),

      email:data.email.trim().toLowerCase(),

      phone:data.phone?.trim()||"",

      location:data.location?.trim()||"Nigeria",

      accountType:
        data.accountType||
        "Buyer & Seller",

      verified:false,

      createdAt:
        new Date().toISOString(),

      avatar:""

    };

    users.push(user);

    this.save(users);

    return user;

  }

};


/* ---------------------------------------------------------
   AUTHENTICATION UI
   --------------------------------------------------------- */

function openLogin(){

      <label>Email</label>

      <input

    <div class="field">

      <label>Password</label>

      <input
        class="input"
        id="loginPassword"
        type="password"
        placeholder="Password"
      >

    </div>

    <br>

    <button
      class="btn primary full"
      onclick="loginUser()"

      Sign in

    <button
      class="btn full"

}


function openRegister(){

    `

      <div class="field">

        <input
          class="input"
          id="registerEmail"
          type="email"
          placeholder="you@example.com"
        >

      </div>

      <div class="field">

        <label>Phone</label>

        <input
          class="input"
          id="registerPhone"
          placeholder="+234..."
        >

      </div>

      <div class="field">

        <label>Location</label>

        <input
          class="input"
          id="registerLocation"
          placeholder="Lagos, Nigeria"
        >

      </div>

      <div class="field">

        <label>Account type</label>

        <select
          class="select"
          id="registerType"
        >

          <option>Buyer & Seller</option>
          <option>Buyer</option>
          <option>Seller</option>
          <option>Dealer</option>

        </select>

      </div>

      <div class="field">

        <label>Password</label>

        <input
          class="input"
          id="registerPassword"
          type="password"
          placeholder="Create password"
        >

      </div>

      <div class="field full">

        <button
          class="btn primary full"
          onclick="registerUser()"
        >
          Create account
        </button>

}


function registerUser(){

  const name=
    document
      .getElementById("registerName")
      .value.trim();

  const email=
    document
      .getElementById("registerEmail")
      .value.trim();

  const phone=
    document
      .getElementById("registerPhone")
      .value.trim();

  const location=
    document
      .getElementById("registerLocation")
      .value.trim();

  const type=
    document
      .getElementById("registerType")
      .value;

  const password=
    document
      .getElementById("registerPassword")
      .value;

  if(!name||!email||!password){

    toast(
      "Please complete the required fields."
    );

    return;

  }

  if(password.length<6){

    toast(
      "Password must contain at least 6 characters."
    );

    return;

  }

  if(UserDB.findByEmail(email)){

    toast(
      "An account with this email already exists."
    );

    return;

  }

  /*
    IMPORTANT:

    This browser implementation only creates
    the account structure.

    The final production version will move
    password handling to the backend so that
    passwords are NEVER stored in browser
    localStorage.
  */

  const user=UserDB.create({

    name,
    email,
    phone,
    location,
    accountType:type

  });

  setSession(user);

  profile=user;

  closeModal();

  updateUserInterface();

  addActivity(
    "Account created",
    "Welcome to CarHub Africa."
  );

  notify(
    "Welcome to CarHub Africa",
    "Your account has been created."
  );

  toast(
    "Account created successfully."
  );

  go("dashboard");

}


function loginUser(){

  const email=
    document
      .getElementById("loginEmail")
      .value.trim();

  const password=
    document
      .getElementById("loginPassword")
      .value;

  if(!email||!password){

    toast(
      "Enter your email and password."
    );

    return;

  }

  const user=
    UserDB.findByEmail(email);

  if(!user){

    toast(
      "Account not found. Create an account first."
    );

    return;

  }

  /*
    Temporary development authentication.

    Production authentication will be handled
    by the shared backend in the next stages.
  */

  setSession(user);

  profile=user;

  closeModal();

  updateUserInterface();

  addActivity(
    "Signed in",
    "You signed in to CarHub Africa."
  );

  toast(
    "Welcome back, "+user.name+"."
  );

  go("dashboard");

}


function logoutUser(){

  clearSession();

  profile={

    id:"guest",

    name:"CarHub User",

    email:"",

    phone:"",

    location:"Nigeria",

    type:"Buyer & Seller"

  };

  updateUserInterface();

  toast(
    "You have been signed out."
  );

  go("home");

}


/* ---------------------------------------------------------
   USER INTERFACE
   --------------------------------------------------------- */

function updateUserInterface(){

  const avatar=
    document.getElementById(
      "headerAvatar"
    );

  if(avatar){

    avatar.textContent=
      initials(profile.name);

  }

  const accountName=
    document.getElementById(
      "accountName"
    );

  if(accountName){

    accountName.textContent=
      profile.name;

  }

  const accountEmail=
    document.getElementById(
      "accountEmail"
    );

  if(accountEmail){

    accountEmail.textContent=
      profile.email||"";

  }

  const accountAvatar=
    document.getElementById(
      "accountAvatar"
    );

  if(accountAvatar){

    accountAvatar.textContent=
      initials(profile.name);

  }

}


/* ---------------------------------------------------------
   ACCOUNT ACCESS CONTROL
   --------------------------------------------------------- */

function requireLogin(action){

  const session=getSession();

  if(session){

    return true;

  }

  openModal(
    "Sign in required",
    `

    <div class="alert">

      Create or sign in to your CarHub
      account before you continue.

    </div>

    <button
      class="btn primary full"
      onclick="openLogin()"
    >
      Sign in
    </button>

    <br><br>

    <button
      class="btn full"
      onclick="openRegister()"
    >
      Create account
    </button>

    `
  );

  return false;

}


/* ---------------------------------------------------------
   PROTECTED ACTIONS
   --------------------------------------------------------- */

const oldOpenMessage=
  window.openMessage;

window.openMessage=function(carId){

  if(!requireLogin("message")){

    return;

  }

  oldOpenMessage(carId);

};


const oldOpenInspection=
  window.openInspection;

window.openInspection=function(carId){

  if(!requireLogin("inspection")){

    return;

  }

  oldOpenInspection(carId);

};


/* ---------------------------------------------------------
   SELLING REQUIRES ACCOUNT
   --------------------------------------------------------- */

const oldCreateListing=
  window.createListing;

window.createListing=function(event){

  if(!requireLogin("sell")){

    event.preventDefault();

    return;

  }

  oldCreateListing(event);

};


/* ---------------------------------------------------------
   PROFILE SESSION
   --------------------------------------------------------- */

function loadCurrentUser(){

  const session=getSession();

  if(session){

    const current=
      UserDB.findById(session.id);

    if(current){

      profile=current;

      setSession(current);

    }

  }

}


/* ---------------------------------------------------------
   ACCOUNT BUTTON
   --------------------------------------------------------- */

function accountAction(){

  if(getSession()){

    go("account");

  }else{

    openLogin();

  }

}

/* ---------------------------------------------------------
   PROFILE SAVE — SHARED USER STRUCTURE
   --------------------------------------------------------- */

function saveProfile(){

  if(!requireLogin("profile")){

    return;

  }

  const session=getSession();

  if(!session)return;

  const user=
    UserDB.findById(session.id);

  if(!user)return;

  user.name=
    document
      .getElementById("profileName")
      .value.trim()||
    "CarHub User";

  user.email=
    document
      .getElementById("profileEmail")
      .value.trim()
      .toLowerCase();

  user.phone=
    document
      .getElementById("profilePhone")
      .value.trim();

  user.location=
    document
      .getElementById("profileLocation")
      .value.trim()||
    "Nigeria";

  user.accountType=
    document
      .getElementById("profileType")
      .value;

  UserDB.save(
    UserDB.all().map(x=>
      x.id===user.id?user:x
    )
  );

  profile=user;

  setSession(user);

  updateUserInterface();

  addActivity(
    "Profile updated",
    "Your CarHub profile was updated."
  );

  toast(
    "Profile saved."
  );

  renderAccount();

}

    "CarHub Seller";

  const sellerLocation=
    seller?.location||
    car.sellerLocation||
    "Nigeria";

  const sellerListings=
    listings.filter(
      item =>
        item.sellerId===car.sellerId
    );

    `

      <div class="account-avatar">

        ${initials(sellerName)}

/* ---------------------------------------------------------
   PROTECTED DASHBOARD

const oldRenderDashboard=

window.renderDashboard=function(){

    document.getElementById(

      <div class="page-title">

        <h1>Dashboard</h1>

        <p>
          Your CarHub activity in one place.

      <div class="glass-panel account-card">

            Sign in to access your dashboard

            Sign in
          </button>

          <button
            class="btn"
            onclick="openRegister()"
          >
            Create account
          </button>

        </div>

/* ---------------------------------------------------------
   NAVIGATION AUTH CHECK
   --------------------------------------------------------- */

const oldGo=
  window.go;

window.go=function(route,id=null){

  const protectedRoutes=[
    "dashboard",
    "messages",
    "inspections",
    "notifications"
  ];

  if(
    protectedRoutes.includes(route) &&
    !getSession()
  ){

    openLogin();

    return;

  }

  oldGo(route,id);

};

   STARTUP
   --------------------------------------------------------- */

updateUserInterface();


/* ---------------------------------------------------------
