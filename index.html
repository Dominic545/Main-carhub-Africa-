<script>

/* =========================================================
   CARHUB LISTING ENGINE
   ========================================================= */

const CARHUB_LISTINGS_KEY = "carhub_shared_listings";


/* ---------------------------------------------------------
   SAFE LISTING STORAGE
   --------------------------------------------------------- */

function getAllCarHubListings(){

  try{

    const data =
      JSON.parse(
        localStorage.getItem(
          CARHUB_LISTINGS_KEY
        )
      );

    return Array.isArray(data)
      ? data
      : [];

  }catch(error){

    return [];

  }

}


function saveAllCarHubListings(items){

  localStorage.setItem(
    CARHUB_LISTINGS_KEY,
    JSON.stringify(items)
  );

}


/* ---------------------------------------------------------
   MIGRATE EXISTING LISTINGS
   --------------------------------------------------------- */

function migrateExistingListings(){

  const existing =
    getAllCarHubListings();

  if(existing.length){

    return existing;

  }

  let oldListings=[];

  try{

    oldListings =
      JSON.parse(
        localStorage.getItem(
          "carhub_listings"
        )
      ) || [];

  }catch(error){

    oldListings=[];

  }

  if(
    Array.isArray(oldListings) &&
    oldListings.length
  ){

    const migrated =
      oldListings.map(item=>({

        ...item,

        sellerId:
          item.sellerId ||
          item.ownerId ||
          profile?.id ||
          "legacy",

        sellerName:
          item.sellerName ||
          item.seller ||
          profile?.name ||
          "CarHub Seller",

        status:
          item.status ||
          "active",

        createdAt:
          item.createdAt ||
          new Date().toISOString(),

        updatedAt:
          new Date().toISOString(),

        images:
          Array.isArray(item.images)
          ?item.images
          :item.image
            ?[item.image]
            :[]

      }));

    saveAllCarHubListings(
      migrated
    );

    return migrated;

  }

  return [];

}


let sharedListings =
  migrateExistingListings();


/* ---------------------------------------------------------
   KEEP OLD VARIABLE COMPATIBLE
   --------------------------------------------------------- */

if(
  typeof listings === "undefined"
){

  var listings =
    sharedListings;

}else{

  listings =
    sharedListings;

}


/* ---------------------------------------------------------
   LISTING HELPERS
   --------------------------------------------------------- */

function syncListings(){

  sharedListings =
    getAllCarHubListings();

  listings =
    sharedListings;

  return sharedListings;

}


function getListing(id){

  syncListings();

  return listings.find(
    item => String(item.id) === String(id)
  );

}


function getSellerListings(sellerId){

  syncListings();

  return listings.filter(
    item =>
      String(item.sellerId) ===
      String(sellerId)
  );

}


/* ---------------------------------------------------------
   IMAGE PROCESSING
   --------------------------------------------------------- */

function carHubReadFile(file){

  return new Promise(
    (resolve,reject)=>{

      const reader =
        new FileReader();

      reader.onload=()=>{
        resolve(reader.result);
      };

      reader.onerror=()=>{
        reject(
          new Error(
            "Unable to read image."
          )
        );
      };

      reader.readAsDataURL(file);

    }
  );

}


function carHubCompressImage(
  file,
  maxWidth=1400,
  quality=.82
){

  return new Promise(
    (resolve,reject)=>{

      const reader =
        new FileReader();

      reader.onload=event=>{

        const image =
          new Image();

        image.onload=()=>{

          let width =
            image.width;

          let height =
            image.height;

          if(width>maxWidth){

            height =
              Math.round(
                height *
                maxWidth /
                width
              );

            width =
              maxWidth;

          }

          const canvas =
            document.createElement(
              "canvas"
            );

          canvas.width=width;

          canvas.height=height;

          const context =
            canvas.getContext(
              "2d"
            );

          context.drawImage(
            image,
            0,
            0,
            width,
            height
          );

          resolve(
            canvas.toDataURL(
              "image/jpeg",
              quality
            )
          );

        };

        image.onerror=()=>{
          reject(
            new Error(
              "Invalid image."
            )
          );
        };

        image.src=
          event.target.result;

      };

      reader.onerror=()=>{
        reject(
          new Error(
            "Could not read image."
          )
        );
      };

      reader.readAsDataURL(file);

    }
  );

}


/* ---------------------------------------------------------
   SELLER INFORMATION
   --------------------------------------------------------- */

function getCurrentSeller(){

  const session =
    typeof getSession === "function"
    ?getSession()
    :null;

  if(!session){

    return null;

  }

  let user=null;

  if(
    typeof UserDB !== "undefined" &&
    UserDB.findById
  ){

    user =
      UserDB.findById(
        session.id
      );

  }

  return {

    id:
      user?.id ||
      session.id,

    name:
      user?.name ||
      session.name ||
      "CarHub Seller",

    email:
      user?.email ||
      session.email ||
      "",

    phone:
      user?.phone ||
      session.phone ||
      "",

    location:
      user?.location ||
      session.location ||
      "Nigeria",

    verified:
      Boolean(
        user?.verified ||
        session.verified
      )

  };

}


/* ---------------------------------------------------------
   BUILD LISTING
   --------------------------------------------------------- */

async function buildCarHubListing(formData){

  const seller =
    getCurrentSeller();

  if(!seller){

    throw new Error(
      "Please sign in before creating a listing."
    );

  }

  const files =
    Array.from(
      formData.files || []
    );

  const images=[];

  for(
    const file of files.slice(0,12)
  ){

    if(
      !file.type.startsWith(
        "image/"
      )
    ){

      continue;

    }

    const image =
      await carHubCompressImage(
        file
      );

    images.push(image);

  }


  const now =
    new Date().toISOString();


  const listing={

    id:
      "car_"+Date.now()
      .toString(36)+
      "_"+
      Math.random()
      .toString(36)
      .slice(2,8),

    sellerId:
      seller.id,

    sellerName:
      seller.name,

    sellerEmail:
      seller.email,

    sellerPhone:
      seller.phone,

    sellerLocation:
      seller.location,

    sellerVerified:
      seller.verified,

    make:
      String(
        formData.make || ""
      ).trim(),

    model:
      String(
        formData.model || ""
      ).trim(),

    year:
      String(
        formData.year || ""
      ).trim(),

    price:
      Number(
        String(
          formData.price || 0
        )
        .replace(/[^\d.]/g,"")
      ),

    mileage:
      String(
        formData.mileage || ""
      ).trim(),

    condition:
      formData.condition ||
      "Used",

    transmission:
      formData.transmission ||
      "",

    fuel:
      formData.fuel ||
      "",

    location:
      formData.location ||
      seller.location ||
      "Nigeria",

    description:
      String(
        formData.description || ""
      ).trim(),

    images,

    status:
      "active",

    views:
      0,

    saves:
      0,

    createdAt:
      now,

    updatedAt:
      now

  };

  return listing;

}


/* ---------------------------------------------------------
   CREATE LISTING
   --------------------------------------------------------- */

async function createCarHubListing(formData){

  const seller =
    getCurrentSeller();

  if(!seller){

    if(
      typeof openLogin ===
      "function"
    ){

      openLogin();

    }

    return null;

  }


  try{

    const listing =
      await buildCarHubListing(
        formData
      );

    if(
      !listing.make ||
      !listing.model ||
      !listing.year ||
      !listing.price
    ){

      toast(
        "Please complete the vehicle details."
      );

      return null;

    }


    const current =
      getAllCarHubListings();

    current.unshift(
      listing
    );

    saveAllCarHubListings(
      current
    );

    sharedListings =
      current;

    listings =
      current;


    if(
      typeof addActivity ===
      "function"
    ){

      addActivity(
        "Vehicle listed",
        `${listing.year} ${listing.make} ${listing.model} is now live on CarHub.`
      );

    }


    if(
      typeof notify ===
      "function"
    ){

      notify(
        "Vehicle published",
        "Your vehicle is now live on CarHub Africa."
      );

    }


    if(
      typeof toast ===
      "function"
    ){

      toast(
        "Vehicle listed successfully."
      );

    }


    return listing;

  }catch(error){

    console.error(
      error
    );

    toast(
      error.message ||
      "Unable to create listing."
    );

    return null;

  }

}


/* ---------------------------------------------------------
   DELETE LISTING
   --------------------------------------------------------- */

function deleteCarHubListing(id){

  const seller =
    getCurrentSeller();

  if(!seller){

    return;

  }

  const current =
    getAllCarHubListings();

  const listing =
    current.find(
      item =>
        String(item.id) ===
        String(id)
    );

  if(!listing){

    return;

  }

  if(
    String(listing.sellerId) !==
    String(seller.id)
  ){

    toast(
      "You can only manage your own listings."
    );

    return;

  }


  const confirmed =
    confirm(
      "Remove this vehicle listing?"
    );

  if(!confirmed){

    return;

  }


  const updated =
    current.filter(
      item =>
        String(item.id) !==
        String(id)
    );

  saveAllCarHubListings(
    updated
  );

  sharedListings =
    updated;

  listings =
    updated;


  if(
    typeof addActivity ===
    "function"
  ){

    addActivity(
      "Vehicle removed",
      "Your vehicle listing was removed."
    );

  }


  toast(
    "Vehicle listing removed."
  );


  if(
    typeof go ===
    "function"
  ){

    go("cars");

  }

}


/* ---------------------------------------------------------
   EDIT LISTING
   --------------------------------------------------------- */

function editCarHubListing(id){

  const seller =
    getCurrentSeller();

  const listing =
    getListing(id);

  if(!seller || !listing){

    return;

  }


  if(
    String(listing.sellerId) !==
    String(seller.id)
  ){

    toast(
      "You can only edit your own listing."
    );

    return;

  }


  openModal(
    "Edit vehicle",
    `

      <div class="form-grid">

        <div class="field">

          <label>Make</label>

          <input
            class="input"
            id="editMake"
            value="${esc(listing.make)}"
          >

        </div>

        <div class="field">

          <label>Model</label>

          <input
            class="input"
            id="editModel"
            value="${esc(listing.model)}"
          >

        </div>

        <div class="field">

          <label>Year</label>

          <input
            class="input"
            id="editYear"
            value="${esc(listing.year)}"
          >

        </div>

        <div class="field">

          <label>Price (₦)</label>

          <input
            class="input"
            id="editPrice"
            inputmode="numeric"
            value="${listing.price || ""}"
          >

        </div>

        <div class="field">

          <label>Mileage</label>

          <input
            class="input"
            id="editMileage"
            value="${esc(listing.mileage || "")}"
          >

        </div>

        <div class="field">

          <label>Condition</label>

          <select
            class="select"
            id="editCondition"
          >

            <option
              ${listing.condition==="New"
                ?"selected":""
              }
            >
              New
            </option>

            <option
              ${listing.condition==="Used"
                ?"selected":""
              }
            >
              Used
            </option>

            <option
              ${listing.condition==="Foreign Used"
                ?"selected":""
              }
            >
              Foreign Used
            </option>

          </select>

        </div>

        <div class="field full">

          <label>Description</label>

          <textarea
            class="textarea"
            id="editDescription"
          >${esc(listing.description || "")}</textarea>

        </div>

        <div class="field full">

          <button
            class="btn primary full"
            onclick="
              saveEditedCarHubListing('${listing.id}')
            "
          >
            Save changes
          </button>

        </div>

      </div>

    `
  );

}


function saveEditedCarHubListing(id){

  const seller =
    getCurrentSeller();

  if(!seller){

    return;

  }

  const current =
    getAllCarHubListings();

  const index =
    current.findIndex(
      item =>
        String(item.id) ===
        String(id)
    );

  if(index<0){

    return;

  }


  if(
    String(
      current[index].sellerId
    ) !==
    String(seller.id)
  ){

    toast(
      "You can only edit your own listing."
    );

    return;

  }


  current[index]={

    ...current[index],

    make:
      document
        .getElementById("editMake")
        .value.trim(),

    model:
      document
        .getElementById("editModel")
        .value.trim(),

    year:
      document
        .getElementById("editYear")
        .value.trim(),

    price:
      Number(
        document
          .getElementById("editPrice")
          .value
          .replace(/[^\d.]/g,"")
      ),

    mileage:
      document
        .getElementById("editMileage")
        .value.trim(),

    condition:
      document
        .getElementById("editCondition")
        .value,

    description:
      document
        .getElementById("editDescription")
        .value.trim(),

    updatedAt:
      new Date().toISOString()

  };


  saveAllCarHubListings(
    current
  );

  sharedListings =
    current;

  listings =
    current;


  closeModal();

  toast(
    "Vehicle updated."
  );


  if(
    typeof go ===
    "function"
  ){

    go(
      "vehicle",
      id
    );

  }

}


/* ---------------------------------------------------------
   IMAGE GALLERY
   --------------------------------------------------------- */

function renderCarHubGallery(listing){

  const images =
    Array.isArray(
      listing.images
    )
    ?listing.images
    :[];


  if(!images.length){

    return `

      <div
        class="vehicle-gallery-empty"
      >

        <span>🚘</span>

        <div>
          No vehicle photos yet
        </div>

      </div>

    `;

  }


  return `

    <div
      class="carhub-gallery"
      data-gallery="${listing.id}"
    >

      <div
        class="carhub-gallery-main"
      >

        <img
          id="galleryMain-${listing.id}"
          src="${esc(images[0])}"
          alt="${esc(
            listing.year+" "+
            listing.make+" "+
            listing.model
          )}"
        >

      </div>


      <div
        class="carhub-gallery-thumbs"
      >

        ${images
          .map(
            (image,index)=>`

              <button
                class="
                  carhub-gallery-thumb
                  ${index===0?"active":""}
                "
                onclick="
                  changeCarHubGallery(
                    '${listing.id}',
                    ${index}
                  )
                "
              >

                <img
                  src="${esc(image)}"
                  alt=""
                >

              </button>

            `
          )
          .join("")}

      </div>

    </div>

  `;

}


function changeCarHubGallery(
  listingId,
  imageIndex
){

  const listing =
    getListing(
      listingId
    );

  if(!listing)return;

  const images =
    listing.images || [];

  const image =
    images[imageIndex];

  if(!image)return;


  const main =
    document.getElementById(
      "galleryMain-"+listingId
    );

  if(main){

    main.style.opacity="0";

    setTimeout(()=>{

      main.src=image;

      main.style.opacity="1";

    },120);

  }


  const gallery =
    document.querySelector(
      `[data-gallery="${listingId}"]`
    );

  if(gallery){

    gallery
      .querySelectorAll(
        ".carhub-gallery-thumb"
      )
      .forEach(
        (button,index)=>{

          button.classList.toggle(
            "active",
            index===imageIndex
          );

        }
      );

  }

}

    document.getElementById(

/* ---------------------------------------------------------
   CONNECT WITH EXISTING SELL FORM
   --------------------------------------------------------- */

function setupCarHubSellForm(){

  const form =
    document.querySelector(
      "#sellForm"
    );

  if(!form){

    return;

  }


  /*
    Prevent the older local-only
    createListing handler.
  */

  form.addEventListener(
    "submit",
    async event=>{

      event.preventDefault();

      const seller =
        getCurrentSeller();

      if(!seller){

        if(
          typeof openLogin ===
          "function"
        ){

          openLogin();

        }

        return;

      }


      const getValue=id=>{

        const el =
          document.getElementById(
            id
          );

        return el
          ?el.value
          :"";

      };


      const fileInput =
        document.querySelector(
          "#sellPhotos"
        ) ||
        document.querySelector(
          "#listingPhotos"
        ) ||
        form.querySelector(
          'input[type="file"]'
        );


      const formData={

        make:
          getValue("sellMake") ||
          getValue("listingMake"),

        model:
          getValue("sellModel") ||
          getValue("listingModel"),

        year:
          getValue("sellYear") ||
          getValue("listingYear"),

        price:
          getValue("sellPrice") ||
          getValue("listingPrice"),

        mileage:
          getValue("sellMileage") ||
          getValue("listingMileage"),

        condition:
          getValue("sellCondition") ||
          getValue("listingCondition") ||
          "Used",

        transmission:
          getValue("sellTransmission") ||
          getValue("listingTransmission"),

        fuel:
          getValue("sellFuel") ||
          getValue("listingFuel"),

        location:
          getValue("sellLocation") ||
          getValue("listingLocation") ||
          seller.location,

        description:
          getValue("sellDescription") ||
          getValue("listingDescription"),

        files:
          fileInput
          ?fileInput.files
          :[]

      };


      const listing =
        await createCarHubListing(
          formData
        );


      if(listing){

        if(
          typeof closeModal ===
          "function"
        ){

          closeModal();

        }


        refreshCarHubCatalogue();

        renderMyVehicles();

        if(
          typeof go ===
          "function"
        ){

          go(
            "vehicle",
            listing.id
          );

        }

      }

    },
    true
  );

}

/* ---------------------------------------------------------
   VIEW TRACKING
   --------------------------------------------------------- */

function registerCarView(id){

  const current =
    getAllCarHubListings();

  const index =
    current.findIndex(
      item =>
        String(item.id) ===
        String(id)
    );

  if(index<0)return;

  current[index].views =
    Number(
      current[index].views || 0
    ) + 1;

  saveAllCarHubListings(
    current
  );

  sharedListings =
    current;

  listings =
    current;

}


/* ---------------------------------------------------------
   SAVE VEHICLE
   --------------------------------------------------------- */

function saveCarHubVehicle(id){

  const session =
    typeof getSession ===
    "function"
    ?getSession()
    :null;

  if(!session){

    if(
      typeof openLogin ===
      "function"
    ){

      openLogin();

    }

    return;

  }


  const key =
    "carhub_saved_"+session.id;

  let saved=[];

  try{

    saved =
      JSON.parse(
        localStorage.getItem(key)
      ) || [];

  }catch(error){

    saved=[];

  }


  const exists =
    saved.includes(id);


  if(exists){

    saved =
      saved.filter(
        item => item!==id
      );

    toast(
      "Vehicle removed from saved."
    );

  }else{

    saved.push(id);

    toast(
      "Vehicle saved."
    );

  }


  localStorage.setItem(
    key,
    JSON.stringify(saved)
  );


  const current =
    getAllCarHubListings();

  const index =
    current.findIndex(
      item =>
        String(item.id) ===
        String(id)
    );

  if(index>=0){

    current[index].saves =
      Math.max(
        0,
        Number(
          current[index].saves || 0
        ) +
        (exists?-1:1)
      );

    saveAllCarHubListings(
      current
    );

    sharedListings =
      current;

    listings =
      current;

  }

}


/* ---------------------------------------------------------
   LISTING STATUS
   --------------------------------------------------------- */

function setCarHubListingStatus(
  id,
  status
){

  const seller =
    getCurrentSeller();

  if(!seller)return;


  const current =
    getAllCarHubListings();

  const index =
    current.findIndex(
      item =>
        String(item.id) ===
        String(id)
    );

  if(index<0)return;


  if(
    String(
      current[index].sellerId
    ) !==
    String(seller.id)
  ){

    toast(
      "You can only manage your own listing."
    );

    return;

  }


  current[index].status =
    status;

  current[index].updatedAt =
    new Date().toISOString();


  saveAllCarHubListings(
    current
  );

  sharedListings =
    current;

  listings =
    current;


  refreshCarHubCatalogue();

}


/* ---------------------------------------------------------
   SELLER DASHBOARD STATISTICS
   --------------------------------------------------------- */

function getSellerStats(){

  const seller =
    getCurrentSeller();

  if(!seller){

    return {

      listings:0,
      active:0,
      views:0,
      saves:0

    };

  }


  const mine =
    getSellerListings(
      seller.id
    );


  return {

    listings:
      mine.length,

    active:
      mine.filter(
        item =>
          item.status==="active"
      ).length,

    views:
      mine.reduce(
        (total,item)=>
          total+
          Number(
            item.views||0
          ),
        0
      ),

    saves:
      mine.reduce(
        (total,item)=>
          total+
          Number(
            item.saves||0
          ),
        0
      )

  };

}


/* ---------------------------------------------------------
   SELLER DASHBOARD WIDGET
   --------------------------------------------------------- */

function renderSellerStats(){

  const container =
    document.getElementById(
      "sellerStats"
    );

  if(!container){

    return;

  }


  const stats =
    getSellerStats();


  container.innerHTML=`

    <div class="stat-card">

      <span>
        My listings
      </span>

      <strong>
        ${stats.listings}
      </strong>

    </div>


    <div class="stat-card">

      <span>
        Active
      </span>

      <strong>
        ${stats.active}
      </strong>

    </div>


    <div class="stat-card">

      <span>
        Views
      </span>

      <strong>
        ${stats.views}
      </strong>

    </div>


    <div class="stat-card">

      <span>
        Saves
      </span>

      <strong>
        ${stats.saves}
      </strong>

    </div>

  `;

}


/* ---------------------------------------------------------
   LISTING SEARCH
   --------------------------------------------------------- */

function searchCarHubListings(query){

  syncListings();

  const q =
    String(query || "")
      .trim()
      .toLowerCase();


  if(!q){

    return listings;

  }


  return listings.filter(
    car =>{

      const text =
        [

          car.make,
          car.model,
          car.year,
          car.location,
          car.condition,
          car.transmission,
          car.fuel,
          car.sellerName

        ]
        .join(" ")
        .toLowerCase();


      return text.includes(q);

    }
  );

}


/* ---------------------------------------------------------
   SEARCH HOOK
   --------------------------------------------------------- */

document.addEventListener(
  "input",
  event=>{

    const input =
      event.target.closest(
        "#searchInput"
      );

    if(!input)return;


    const results =

              >

                ${esc(car.year)}
                ${esc(car.make)}
                ${esc(car.model)}

              </div>

              <div

function initializeCarHubListings(){

window.CarHubAPI={

<!-- =========================================================

<script>

/* =========================================================
   CARHUB COMMUNICATION ENGINE
   ========================================================= */

const CH_MESSAGES_KEY =
  "carhub_messages_v2";

const CH_INSPECTIONS_KEY =
  "carhub_inspections_v2";

const CH_ALERTS_KEY =
  "carhub_transaction_alerts_v2";


/* =========================================================
   GENERIC STORAGE
   ========================================================= */

function chRead(key, fallback=[]){

  try{

    const value =
      JSON.parse(
        localStorage.getItem(key)
      );

    return value ?? fallback;

  }catch(error){

    return fallback;

  }

}


function chWrite(key,value){

  localStorage.setItem(
    key,
    JSON.stringify(value)
  );

}


/* =========================================================
   CURRENT USER
   ========================================================= */

function chCurrentUser(){

  if(
    typeof getCurrentSeller ===
    "function"
  ){

    return getCurrentSeller();

  }

  if(
    typeof getSession ===
    "function"
  ){

    const session =
      getSession();

    if(session){

      return {

        id:session.id,

        name:
          session.name ||
          "CarHub User",

        email:
          session.email ||
          "",

        phone:
          session.phone ||
          "",

        location:
          session.location ||
          "Nigeria"

      };

    }

  }

  return null;

}


/* =========================================================
   CONVERSATION ID
   ========================================================= */

function chConversationId(
  listingId,
  buyerId,
  sellerId
){

  return [

    String(listingId || ""),
    String(buyerId || ""),
    String(sellerId || "")

  ].join("_");

}


/* =========================================================
   FIND LISTING
   ========================================================= */

function chFindListing(id){

  if(
    typeof getListing ===
    "function"
  ){

    return getListing(id);

  }

  try{

    const data =
      JSON.parse(
        localStorage.getItem(
          "carhub_shared_listings"
        )
      ) || [];

    return data.find(
      item =>
        String(item.id) ===
        String(id)
    );

  }catch(error){

    return null;

  }

}


/* =========================================================
   OPEN MESSAGE
   ========================================================= */

function openMessage(
  listingId
){

  const user =
    chCurrentUser();

  if(!user){

    if(
      typeof openLogin ===
      "function"
    ){

      openLogin();

    }

    return;

  }


  const listing =
    chFindListing(
      listingId
    );

  if(!listing){

    toast(
      "Vehicle listing not found."
    );

    return;

  }


  if(
    String(listing.sellerId) ===
    String(user.id)
  ){

    toast(
      "This is your own listing."
    );

    return;

  }


  const sellerId =
    listing.sellerId;


  const conversation =
    chConversationId(
      listing.id,
      user.id,
      sellerId
    );


  chOpenConversation(
    listing,
    conversation,
    sellerId
  );

}


/* =========================================================
   OPEN CONVERSATION
   ========================================================= */

function chOpenConversation(
  listing,
  conversationId,
  sellerId
){

  const user =
    chCurrentUser();


  const messages =
    chRead(
      CH_MESSAGES_KEY,
      []
    );


  const conversationMessages =
    messages.filter(
      message =>
        message.conversationId ===
        conversationId
    );


  const seller =
    (
      typeof UserDB !==
      "undefined" &&
      UserDB.findById
    )
    ?UserDB.findById(
      sellerId
    )
    :null;


  const sellerName =
    seller?.name ||
    listing.sellerName ||
    "CarHub Seller";


  const firstMessage =
    conversationMessages.length ===
    0;


  openModal(
    `Message ${sellerName}`,
    `

      <div
        class="ch-chat"
      >

        <div
          class="ch-chat-header"
        >

          <div
            class="seller-avatar"
          >

            ${initials(
              sellerName
            )}

          </div>

          <div>

            <strong>
              ${esc(sellerName)}
            </strong>

            <div
              class="seller-location"
            >

              ${esc(
                listing.location ||
                listing.sellerLocation ||
                "Nigeria"
              )}

            </div>

          </div>

        </div>


        <div
          class="ch-vehicle-reference"
        >

          <div
            class="ch-reference-image"
          >

            <img
              src="${esc(
                listing.images?.[0] ||
                ""
              )}"
              alt=""
            >

          </div>

          <div>

            <strong>
              ${esc(
                listing.year
              )}
              ${esc(
                listing.make
              )}
              ${esc(
                listing.model
              )}
            </strong>

            <div>
              ${money(
                listing.price
              )}
            </div>

          </div>

        </div>


        <div
          id="chMessages-${conversationId}"
          class="ch-messages"
        >

          ${
            firstMessage
            ?`

              <div
                class="ch-empty-chat"
              >

                Start a conversation
                with the seller.

              </div>

            `
            :
            conversationMessages
              .map(
                chRenderMessage
              )
              .join("")
          }

        </div>


        <div
          class="ch-quick-actions"
        >

          <button
            class="btn small"
            onclick="
              chQuickMessage(
                '${conversationId}',
                '${listing.id}',
                'Is this vehicle still available?'
              )
            "
          >
            Available?
          </button>

          <button
            class="btn small"
            onclick="
              chQuickMessage(
                '${conversationId}',
                '${listing.id}',
                'Can I book an inspection?'
              )
            "
          >
            Inspection
          </button>

          <button
            class="btn small"
            onclick="
              openInspection(
                '${listing.id}'
              )
            "
          >
            Book inspection
          </button>

        </div>


        <div
          class="ch-compose"
        >

          <textarea
            id="chInput-${conversationId}"
            class="textarea"
            rows="2"
            placeholder="Write a message..."
          ></textarea>


          <button
            class="btn primary full"
            onclick="
              chSendMessage(
                '${listing.id}',
                '${conversationId}',
                '${sellerId}'
              )
            "
          >

            Send message

          </button>

        </div>

      </div>

    `
  );


  chMarkConversationRead(
    conversationId
  );

}


/* =========================================================
   RENDER MESSAGE
   ========================================================= */

function chRenderMessage(
  message
){

  const user =
    chCurrentUser();


  const mine =
    String(
      message.senderId
    ) ===
    String(
      user?.id
    );


  return `

    <div
      class="
        ch-message-row
        ${mine?"mine":"theirs"}
      "
    >

      <div
        class="ch-message-bubble"
      >

        <div>
          ${esc(
            message.text
          )}
        </div>

/* =========================================================
   SEND MESSAGE
   ========================================================= */

function chSendMessage(
  listingId,
  conversationId,
  sellerId
){

  const user =
    chCurrentUser();

  if(!user){

    return;

  }


  const input =
    document.getElementById(
      "chInput-"+conversationId
    );

  if(!input){

    return;

  }


  const text =
    input.value.trim();


  if(!text){

    return;

  }


  const listing =
    chFindListing(
      listingId
    );


  const messages =
    chRead(
      CH_MESSAGES_KEY,
      []
    );


  const message={

    id:
      "msg_"+Date.now()+
      "_"+
      Math.random()
        .toString(36)
        .slice(2,7),

    conversationId,

    listingId,

    senderId:
      user.id,

    senderName:
      user.name ||
      "CarHub User",

    receiverId:
      sellerId,

    receiverName:
      listing?.sellerName ||
      "CarHub Seller",

    text,

    read:false,

    createdAt:
      new Date().toISOString()

  };


  messages.push(
    message
  );


  chWrite(
    CH_MESSAGES_KEY,
    messages
  );


  chCheckTransactionStage(
    message,
    listing
  );


  input.value="";


  chRefreshOpenConversation(
    listingId,
    conversationId,
    sellerId
  );


  if(
    typeof addActivity ===
    "function"
  ){

    addActivity(
      "Message sent",
      `Your message to ${
        listing?.sellerName ||
        "the seller"
      } was sent.`
    );

  }

}

/* =========================================================
   MARK READ
   ========================================================= */

function chMarkConversationRead(
  conversationId
){

  const user =
    chCurrentUser();

  if(!user){

    return;

  }


  const messages =
    chRead(
      CH_MESSAGES_KEY,
      []
    );


  let changed=false;


  messages.forEach(
    message=>{

      if(
        message.conversationId ===
        conversationId &&

        String(

        ) ===
        String(user.id) &&

        !message.read

        changed=true;

    }
  );


  if(changed){

    chWrite(
      CH_MESSAGES_KEY,
      messages
    );

  }

}

/* =========================================================
   CONVERSATIONS
   ========================================================= */

function chGetConversations(){

  const messages =
    chGetMyMessages();


  const map={};


  messages.forEach(
    message=>{

      if(
        !map[
          message.conversationId
        ]
      ){

        map[
          message.conversationId
        ]=[];

      }

      map[
        message.conversationId
      ].push(
        message
      );

    }
  );


  return Object.keys(
    map
  ).map(
    id=>{

      const items =
        map[id]
          .sort(
            (a,b)=>
              new Date(
                a.createdAt
              ) -
              new Date(
                b.createdAt
              )
          );


      const last =
        items[
          items.length-1
        ];


      return {

        id,

        messages:
          items,

        lastMessage:
          last,

        unread:
          items.filter(
            message=>
              !message.read &&
              String(
                message.receiverId
              ) ===
              String(
                chCurrentUser()?.id
              )
          ).length

      };

    }
  );

}

/* =========================================================
   TRANSACTION STAGE DETECTION
   ========================================================= */

const CH_TRANSACTION_TERMS=[

  "payment",
  "pay",
  "paid",
  "deposit",
  "transfer",
  "bank",
  "account",
  "money",
  "send money",
  "price",
  "deal",
  "buy",
  "purchase",
  "sold",
  "sale",
  "receipt",
  "invoice",
  "balance",
  "advance"

];


function chCheckTransactionStage(
  message,
  listing
){

  const text =
    String(
      message.text || ""
    )
    .toLowerCase();


  const matched =
    CH_TRANSACTION_TERMS
      .filter(
        term =>
          text.includes(term)
      );


  if(
    matched.length <
    1
  ){

    return null;

  }


  const alerts =
    chRead(
      CH_ALERTS_KEY,
      []
    );


  const alert={

    id:
      "alert_"+Date.now()+
      "_"+
      Math.random()
        .toString(36)
        .slice(2,7),

    conversationId:
      message.conversationId,

    messageId:
      message.id,

    listingId:
      message.listingId,

    sellerId:
      listing?.sellerId,

    buyerId:
      message.senderId,

    terms:
      matched,

    text:
      message.text,

    status:
      "new",

    createdAt:
      new Date().toISOString()

  };


  alerts.unshift(
    alert
  );


  /*
    Prevent duplicate alerts for
    the exact same message.
  */

  const unique =
    alerts.filter(
      (item,index,array)=>
        array.findIndex(
          other =>
            other.messageId ===
            item.messageId
        ) === index
    );


  chWrite(
    CH_ALERTS_KEY,
    unique
  );


  /*
    Notify the seller when a buyer's
    conversation reaches transaction
    language.
  */

  if(
    listing &&
    String(
      listing.sellerId
    ) !==
    String(
      message.senderId
    )
  ){

    if(
      typeof notify ===
      "function"
    ){

      notify(
        "Conversation needs attention",
        `A buyer's message about ${
          listing.year || ""
        } ${
          listing.make || ""
        } ${
          listing.model || ""
        } contains transaction-related language.`
      );

    }

  }


  return alert;

}

/* =========================================================
   SUBMIT INSPECTION
   ========================================================= */

function submitCarHubInspection(
  listingId
){

  const user =
    chCurrentUser();

  if(!user){

    return;

  }


  const listing =
    chFindListing(
      listingId
    );

  if(!listing){

    return;

  }


  const date =
    document
      .getElementById(
        "inspectionDate"
      )
      ?.value;


  const time =
    document
      .getElementById(
        "inspectionTime"
      )
      ?.value;


  const note =
    document
      .getElementById(
        "inspectionNote"
      )
      ?.value
      ?.trim() || "";


  if(!date || !time){

    toast(
      "Choose an inspection date and time."
    );

    return;

  }


  const selected =
    new Date(
      `${date}T${time}:00`
    );


  if(
    selected <
    new Date()
  ){

    toast(
      "Please choose a future inspection time."
    );

    return;

  }


  const inspections =
    chRead(
      CH_INSPECTIONS_KEY,
      []
    );


  const inspection={

    id:
      "inspection_"+Date.now()+
      "_"+
      Math.random()
        .toString(36)
        .slice(2,7),

    listingId,

    buyerId:
      user.id,

    buyerName:
      user.name ||
      "CarHub Buyer",

    buyerPhone:
      user.phone ||
      "",

    sellerId:
      listing.sellerId,

    sellerName:
      listing.sellerName ||
      "CarHub Seller",

    date,

    time,

    note,

    status:
      "requested",

    createdAt:
      new Date().toISOString(),

    updatedAt:
      new Date().toISOString()

  };


  inspections.unshift(
    inspection
  );


  chWrite(
    CH_INSPECTIONS_KEY,
    inspections
  );


  if(
    typeof notify ===
    "function"
  ){

    notify(
      "Inspection requested",
      `Inspection requested for ${
        listing.year
      } ${
        listing.make
      } ${
        listing.model
      }.`
    );

  }


  if(
    typeof addActivity ===
    "function"
  ){

    addActivity(
      "Inspection requested",
      `Your inspection request is scheduled for ${date} at ${time}.`
    );

  }


  closeModal();


  toast(
    "Inspection request sent."
  );

}

/* =========================================================
   UPDATE INSPECTION
   ========================================================= */

function updateCarHubInspection(
  inspectionId,
  status
){

  const user =
    chCurrentUser();

  if(!user){

    return;

  }


  const inspections =
    chRead(
      CH_INSPECTIONS_KEY,
      []
    );


  const index =
    inspections.findIndex(
      item =>
        String(
          item.id
        ) ===
        String(
          inspectionId
        )
    );


  if(index<0){

    return;

  }


  const item =
    inspections[index];


  const isBuyer =
    String(
      item.buyerId
    ) ===
    String(user.id);


  const isSeller =
    String(
      item.sellerId
    ) ===
    String(user.id);


  if(
    !isBuyer &&
    !isSeller
  ){

    toast(
      "You cannot change this inspection."
    );

    return;

  }


  item.status =
    status;

  item.updatedAt =
    new Date().toISOString();


  chWrite(
    CH_INSPECTIONS_KEY,
    inspections
  );


  if(
    typeof notify ===
    "function"
  ){

    notify(
      "Inspection updated",
      `Inspection status: ${status}.`
    );

  }


  renderCarHubInspections();

}

/* =========================================================
   REMINDER ENGINE
   ========================================================= */

function chInspectionReminder(){

  const user =
    chCurrentUser();

  if(!user){

    return;

  }


  const inspections =
    chMyInspections();


  const now =
    new Date();


  inspections.forEach(
    inspection=>{

      if(
        inspection.status !==
        "confirmed"
      ){

        return;

      }


      const date =
        new Date(
          `${inspection.date}T${inspection.time}:00`
        );


      const diff =
        date.getTime() -
        now.getTime();


      const hours =
        diff /
        1000 /
        60 /
        60;


      if(
        hours>0 &&
        hours<=24
      ){

        const key =
          "ch_reminder_"+inspection.id;


        if(
          !localStorage.getItem(
            key
          )
        ){

          if(
            typeof notify ===
            "function"
          ){

            notify(
              "Inspection reminder",
              `Your vehicle inspection is tomorrow at ${inspection.time}.`
            );

          }


          localStorage.setItem(
            key,
            "1"
          );

        }

      }

    }
  );

}


/* =========================================================
   DATE/TIME FORMAT
   ========================================================= */

function chFormatTime(
  iso
){

  if(!iso){

    return "";

  }


  const date =
    new Date(
      iso
    );


  return date.toLocaleString(
    "en-NG",
    {

      day:"numeric",
      month:"short",
      hour:"numeric",
      minute:"2-digit"

    }
  );

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function chEscapeText(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


if(
  typeof esc ===
  "undefined"
){

  window.esc =
    chEscapeText;

}


/* =========================================================
   NOTIFICATION BADGE
   ========================================================= */

function updateCarHubMessageBadge(){

  const count =
    chUnreadCount();


  document
    .querySelectorAll(
      "[data-message-badge]"
    )
    .forEach(
      badge=>{

        badge.textContent =
          count>99
          ?"99+"
          :count;


        badge.style.display =
          count
          ?"inline-flex"
          :"none";

      }
    );

}


/* =========================================================
   INSPECTION BADGE
   ========================================================= */

function updateCarHubInspectionBadge(){

  const user =
    chCurrentUser();

  if(!user){

    return;

  }


  const count =
    chMyInspections()
      .filter(
        item =>
          item.status ===
          "requested"
      )
      .length;


  document
    .querySelectorAll(
      "[data-inspection-badge]"
    )
    .forEach(
      badge=>{

        badge.textContent =
          count;

        badge.style.display =
          count
          ?"inline-flex"
          :"none";

      }
    );

}


/* =========================================================
   AUTO REFRESH
   ========================================================= */

function initializeCarHubCommunication(){

  renderCarHubMessages();

  renderCarHubInspections();

  updateCarHubMessageBadge();

  updateCarHubInspectionBadge();

  chInspectionReminder();


  /*
    Keep the local prototype responsive
    when another CarHub action changes data.
  */

  setInterval(
    ()=>{

      updateCarHubMessageBadge();

      updateCarHubInspectionBadge();

      chInspectionReminder();

    },
    15000
  );

}


document.addEventListener(
  "DOMContentLoaded",
  initializeCarHubCommunication
);


/* =========================================================
   PUBLIC COMMUNICATION API
   ========================================================= */

window.CarHubCommunication={

  messages:{

    open:
      openMessage,

    send:
      chSendMessage,

    conversations:
      chGetConversations,

    unread:
      chUnreadCount

  },


  inspections:{

    open:
      openInspection,

    all:
      chMyInspections,

    update:
      updateCarHubInspection

  },


  alerts:{

    all:
      chGetMyAlerts,

    read:
      chMarkAlertRead

  }

};


console.log(
  "CarHub Africa communication engine loaded."
);
